<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로보독 방탈출</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow column, one mission card at a time, progress rail on top — a phone held by a team of two. */
:root{
  --bg:#FFFFFF; --surface:#F4F7F8; --ink:#1F2E35; --muted:#5B7480; --line:#D3E3E7;
  --navy:#1F4E5F; --teal:#1B8691; --teal-soft:#D3EEF0; --ok:#1B8691; --bad:#C2553A;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A1F; --surface:#17262D; --ink:#E6EEF0; --muted:#93AAB3; --line:#2A3E46;
  --navy:#9FD3DA; --teal:#4FC1CB; --teal-soft:#173A40; --ok:#4FC1CB; --bad:#F08A6C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A1F; --surface:#17262D; --ink:#E6EEF0; --muted:#93AAB3; --line:#2A3E46;
  --navy:#9FD3DA; --teal:#4FC1CB; --teal-soft:#173A40; --ok:#4FC1CB; --bad:#F08A6C; color-scheme:dark}
*{box-sizing:border-box}
body{word-break:keep-all;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-size:1.35rem;font-weight:700;color:var(--navy);margin:0;letter-spacing:-0.01em}
.team{font-family:var(--font-mono);font-size:.85rem;color:var(--muted)}
.rail{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;list-style:none;margin:0;padding:0}
.rail li{font-size:.72rem;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:6px}
.rail li::before{content:"";height:5px;border-radius:3px;background:var(--line)}
.rail li.done::before{background:var(--teal)}
.rail li.now{color:var(--navy);font-weight:600}
.rail li.now::before{background:var(--teal);opacity:.45}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:.78rem;font-weight:600;color:var(--teal);letter-spacing:.06em}
h2{font-size:1.3rem;margin:0;color:var(--navy);text-wrap:balance;line-height:1.35}
p{margin:0;color:var(--ink)}
.sub{color:var(--muted);font-size:.92rem}
button{font:inherit;cursor:pointer;border-radius:12px;border:0}
.big{background:var(--navy);color:var(--bg);font-size:1.15rem;font-weight:700;padding:18px;width:100%}
.ghost{background:transparent;color:var(--muted);font-size:.85rem;padding:8px;text-decoration:underline;text-underline-offset:3px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick button{background:var(--bg);border:2px solid var(--line);color:var(--navy);font-size:1.6rem;font-weight:700;padding:22px 0}
.pick button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
label{font-size:.85rem;font-weight:600;color:var(--muted)}
input{font:inherit;font-family:var(--font-mono);font-size:1.5rem;letter-spacing:.12em;text-transform:uppercase;width:100%;
  padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus,button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.row{display:flex;gap:10px}
.row input{flex:1;min-width:0}
.row button{background:var(--teal);color:#fff;font-weight:700;padding:0 20px;font-size:1rem}
.msg{min-height:1.5em;font-size:.95rem;font-weight:600}
.msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.stamp{border:2px dashed var(--teal);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.stamp strong{color:var(--teal);font-size:1.15rem}
.teacher{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.teacher input{letter-spacing:.5em;text-align:center}
.qrbox{background:#fff;border-radius:12px;padding:14px;display:flex;justify-content:center;border:1px solid var(--line)}
canvas{width:min(100%,300px);height:auto;image-rendering:pixelated;display:block}
.meter{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:.85rem;color:var(--muted)}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--teal);transition:width .15s}
.meter.over{color:var(--bad)} .meter.over .bar span{background:var(--bad)}
.tips{font-size:.85rem;color:var(--muted);margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:2px}
footer{display:flex;justify-content:center}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.bar span{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>로보독 방탈출</h1>
    <span class="team" id="teamTag"></span>
  </header>
  <ol class="rail" id="rail" hidden>
    <li>첫 번째 마당</li><li>C 퍼즐</li><li>두 번째 마당</li><li>금고</li>
  </ol>
  <main id="view"></main>
  <footer><button class="ghost" id="resetBtn" hidden>처음부터 다시</button></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const H = { // sha256("robodog|" + 정답) — 정답 원문은 페이지에 없습니다
  A1:"586b8b30138abcf3e21dc9b22a63638fc3fc086c55e8b5db98e281ea41227d92",
  B1:"7588b5845cc4bc806a36fcf29a060b532ecf3989ffd2f178257033d4197df4b3",
  A2:"5b03369f4ba681d06c032474f95827d5c5adca8b28492bfeb8e966037742bb9c",
  B2:"f2f7a59034412dbac5fd4692e6560a08cd041d4d52fc43a2cccebcbbd8959315",
  PIN:"83d292bf86ef9de4d17e2a75f6d0cad96dbc69fca1f1be11be49e1c4d49af85f"
};
const KEY="robodog-escape-v1";
let S={stage:"home",group:null};
try{const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.stage) S=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const norm=v=>v.toUpperCase().replace(/[^A-Z0-9]/g,"");
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("robodog|"+t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
const $=s=>document.querySelector(s);
const view=$("#view");
const ORDER=["yard1","puzzle","yard2","final"];

function go(stage){S.stage=stage;save();render();window.scrollTo(0,0);}
function rail(){
  const r=$("#rail"); const i=ORDER.indexOf(S.stage);
  r.hidden=i<0;
  [...r.children].forEach((li,k)=>{li.className=k<i?"done":k===i?"now":"";});
  $("#teamTag").textContent=S.group?`${S.group}조`:"";
  $("#resetBtn").hidden=S.stage==="home";
}
function answerForm(id,ph,onOk,badMsg){
  return {html:`<div class="row"><input id="${id}" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="${ph}" aria-label="정답"><button id="${id}Btn">확인</button></div><p class="msg" id="${id}Msg" role="status"></p>`,
  bind(){const inp=$("#"+id),btn=$("#"+id+"Btn"),msg=$("#"+id+"Msg");
    const check=async()=>{const v=norm(inp.value); if(!v){msg.className="msg bad";msg.textContent="정답을 입력하세요.";return;}
      if(await onOk(v)) return; msg.className="msg bad";msg.textContent=badMsg;
      inp.classList.remove("shake");void inp.offsetWidth;inp.classList.add("shake");inp.select();};
    btn.onclick=check; inp.onkeydown=e=>{if(e.key==="Enter")check();};}};
}

function render(){
  rail();
  const g=S.group;
  if(S.stage==="home"){
    view.innerHTML=`<div class="card">
      <span class="eyebrow">2인 1조 미션</span>
      <h2>로봇을 몰아 QR 단서를 모으고, 암호를 풀어 금고를 여세요.</h2>
      <p class="sub">한 명은 조이패드로 로봇을 조종하고, 한 명은 단서를 모아 암호를 풉니다. 카드는 로봇 카메라로만 읽어야 해요.</p>
      <button class="big" id="start">미션 수행</button></div>`;
    $("#start").onclick=()=>go("group");
  }
  else if(S.stage==="group"){
    view.innerHTML=`<div class="card">
      <span class="eyebrow">조 선택</span>
      <h2>우리 조는 어느 마당에서 출발하나요?</h2>
      <div class="pick"><button data-g="A" aria-pressed="false">A조</button><button data-g="B" aria-pressed="false">B조</button></div>
      <p class="sub">선생님이 알려준 조를 고르세요. 잘못 고르면 정답이 맞아도 통과할 수 없어요.</p>
      <button class="big" id="next" disabled style="opacity:.4">시작</button></div>`;
    let pick=null;
    view.querySelectorAll(".pick button").forEach(b=>b.onclick=()=>{pick=b.dataset.g;
      view.querySelectorAll(".pick button").forEach(x=>x.setAttribute("aria-pressed",x===b));
      const n=$("#next");n.disabled=false;n.style.opacity=1;});
    $("#next").onclick=()=>{if(pick){S.group=pick;go("yard1");}};
  }
  else if(S.stage==="yard1"){
    const f=answerForm("a1","영어 단어",async v=>{if(await sha(v)===H[g+"1"]){go("puzzle");return true;}return false;},
      "아직 아니에요. 모은 카드를 다시 살펴보세요.");
    view.innerHTML=`<div class="card">
      <span class="eyebrow">${g}마당 · 첫 번째 미션</span>
      <h2>${g}1 카드를 모두 모아 숨은 단어를 찾으세요.</h2>
      <p class="sub">카드에 적힌 번호는 글자의 순서예요. 열쇠 카드가 힌트를 줄 거예요.</p>
      <label for="a1">찾은 단어</label>${f.html}</div>`;
    f.bind();
  }
  else if(S.stage==="puzzle"){
    view.innerHTML=`<div class="card">
      <span class="eyebrow">첫 번째 마당 통과</span>
      <div class="stamp"><strong>성공!</strong>
        <p>선생님께 가서 <b>Crossword</b>를 받아오세요. 다 풀면 문제지를 들고 다시 선생님께 확인받으세요.</p>
        <p class="sub">찾은 단어는 문제지 아래 정답란에 적어 두세요. 다른 조에게는 절대 말하지 마세요!</p></div>
      <div class="teacher"><label for="pin">선생님 확인 (비밀번호 4자리)</label>
        <div class="row"><input id="pin" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="선생님 비밀번호"><button id="pinBtn">열기</button></div>
        <p class="msg" id="pinMsg" role="status"></p></div></div>`;
    const inp=$("#pin"),msg=$("#pinMsg");
    const check=async()=>{if(await sha(inp.value.trim())===H.PIN){go("yard2");return;}
      msg.className="msg bad";msg.textContent="비밀번호가 맞지 않아요.";inp.value="";
      inp.classList.remove("shake");void inp.offsetWidth;inp.classList.add("shake");};
    $("#pinBtn").onclick=check; inp.onkeydown=e=>{if(e.key==="Enter")check();};
  }
  else if(S.stage==="yard2"){
    const f=answerForm("a2","영어 단어",async v=>{if(await sha(v)===H[g+"2"]){go("final");return true;}return false;},
      "아직 아니에요. 이번엔 열쇠 카드가 없어요. 직접 찾아보세요.");
    view.innerHTML=`<div class="card">
      <span class="eyebrow">${g}마당 · 두 번째 미션</span>
      <h2>${g}2 카드를 모두 모아 두 번째 단어를 찾으세요.</h2>
      <p class="sub">이번에는 열쇠 카드가 없어요. 첫 번째 미션에서 알아낸 방법을 떠올려 보세요.</p>
      <label for="a2">찾은 단어</label>${f.html}</div>`;
    f.bind();
  }
  else if(S.stage==="final"){
    view.innerHTML=`<div class="card">
      <span class="eyebrow">마지막 문제</span>
      <h2>세 단어를 이어 질문을 완성하고, 그 답을 금고 로봇에게 보여주세요.</h2>
      <p class="sub">문제지 아래 정답란에 단어를 순서대로 채우면 질문이 완성돼요. 답을 입력하면 아래에 QR 코드가 바로 만들어집니다.</p>
      <label for="ans">질문의 답 (영어 또는 숫자)</label>
      <input id="ans" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="정답">
      <div class="meter" id="meter"><span id="bytes">0 / 8 바이트</span><div class="bar"><span id="barFill" style="width:0"></span></div></div>
      <div class="qrbox"><canvas id="qr" width="290" height="290" aria-label="정답 QR 코드"></canvas></div>
      <ul class="tips"><li>화면 밝기를 최대로 올리세요.</li><li>로봇 카메라 앞 15~20cm에서 QR을 잠깐 멈춰 보여주세요.</li><li>"멍멍" 소리가 나면 탈출 성공!</li></ul></div>`;
    const inp=$("#ans");
    const upd=()=>{const raw=inp.value.trim().toUpperCase();const n=new TextEncoder().encode(raw).length;
      $("#bytes").textContent=`${n} / 8 바이트`;$("#barFill").style.width=Math.min(100,n/8*100)+"%";
      $("#meter").classList.toggle("over",n>8);drawQR(raw&&n<=8?raw:"");try{localStorage.setItem(KEY+"-ans",inp.value);}catch(e){}};
    try{inp.value=localStorage.getItem(KEY+"-ans")||"";}catch(e){}
    inp.oninput=upd; upd();
    try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{});}catch(e){}
  }
}
function drawQR(text){
  const cv=$("#qr"),ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);
  if(!text||typeof qrcode==="undefined"){ctx.fillStyle="#9DB0B8";ctx.font="15px sans-serif";ctx.textAlign="center";
    ctx.fillText(text===""?"정답을 입력하면 QR이 나타나요":"QR을 만들 수 없어요",cv.width/2,cv.height/2);return;}
  const q=qrcode(0,"M");q.addData(text);q.make();
  const n=q.getModuleCount(),quiet=4,cell=Math.floor(cv.width/(n+quiet*2)),off=Math.floor((cv.width-cell*n)/2);
  ctx.fillStyle="#000";
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(off+c*cell,off+r*cell,cell,cell);
}
let armed=false;
$("#resetBtn").onclick=e=>{
  if(!armed){armed=true;e.target.textContent="정말 처음부터? 한 번 더 누르세요";setTimeout(()=>{armed=false;e.target.textContent="처음부터 다시";},3000);return;}
  armed=false;e.target.textContent="처음부터 다시";S={stage:"home",group:null};try{localStorage.removeItem(KEY+"-ans");}catch(_){}go("home");
};
render();
</script>
</body>
</html>
