/* Layout: one narrow column, one card at a time, progress rail on top — a phone held by a team of two. */
:root{
  --bg:#FFFFFF; --surface:#F4F7F8; --ink:#1F2E35; --muted:#5B7480; --line:#D3E3E7;
  --navy:#1F4E5F; --teal:#1B8691; --teal-soft:#D3EEF0; --ok:#1B8691; --bad:#C2553A; --on-accent:#FFFFFF;
  --font:"Gmarket Sans","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A1F; --surface:#17262D; --ink:#E6EEF0; --muted:#9BB1B9; --line:#2A3E46;
  --navy:#A8D8DE; --teal:#4FC1CB; --teal-soft:#173A40; --ok:#4FC1CB; --bad:#F08A6C; --on-accent:#0F1A1F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A1F; --surface:#17262D; --ink:#E6EEF0; --muted:#9BB1B9; --line:#2A3E46;
  --navy:#A8D8DE; --teal:#4FC1CB; --teal-soft:#173A40; --ok:#4FC1CB; --bad:#F08A6C; --on-accent:#0F1A1F; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;font-size:17px;line-height:1.6;word-break:keep-all;
  font-variant-numeric:tabular-nums;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:1.45rem;font-weight:700;color:var(--navy);margin:0}
.team{font-size:.95rem;font-weight:700;color:var(--teal)}
.back{align-self:flex-start;background:transparent;color:var(--muted);font-size:.95rem;padding:6px 0}
.rail{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;list-style:none;margin:0;padding:0}
.rail li{font-size:.78rem;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:6px}
.rail li::before{content:"";height:6px;border-radius:3px;background:var(--line)}
.rail li.done::before{background:var(--teal)}
.rail li.now{color:var(--navy);font-weight:700}
.rail li.now::before{background:var(--teal);opacity:.45}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 20px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:.85rem;font-weight:700;color:var(--teal);letter-spacing:.04em}
h2{font-size:1.4rem;font-weight:700;margin:0;color:var(--navy);text-wrap:balance;line-height:1.4}
p{margin:0}
.sub{color:var(--muted);font-size:1rem}
button{font:inherit;cursor:pointer;border-radius:14px;border:0}
.big{background:var(--navy);color:var(--bg);font-size:1.2rem;font-weight:700;padding:20px;width:100%}
.menu{display:flex;flex-direction:column;gap:14px}
.menu button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:22px 20px;width:100%}
.menu .m1{background:var(--surface);border:2px solid var(--teal);color:var(--navy)}
.menu .m2{background:var(--navy);color:var(--bg)}
.menu b{font-size:1.35rem;font-weight:700}
.menu span{font-size:.95rem;opacity:.85}
.ghost{background:transparent;color:var(--muted);font-size:.9rem;padding:8px;text-decoration:underline;text-underline-offset:3px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick button{background:var(--bg);border:2px solid var(--line);color:var(--navy);font-size:1.7rem;font-weight:700;padding:24px 0}
.pick button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.big:disabled{opacity:.4;cursor:default}
label{font-size:.95rem;font-weight:700;color:var(--muted)}
input{font:inherit;font-weight:700;font-size:1.5rem;letter-spacing:.08em;width:100%;
  padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input.up{text-transform:uppercase}
input:focus,button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.row{display:flex;gap:10px}
.row input{flex:1;min-width:0}
.row button{background:var(--teal);color:var(--on-accent);font-weight:700;padding:0 20px;font-size:1.05rem}
.msg{font-size:1rem;font-weight:700}
.msg:empty{display:none}
.msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.stamp{border:2px dashed var(--teal);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.stamp strong{color:var(--teal);font-size:1.3rem}
.teacher{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:8px}
.teacher input{letter-spacing:.5em;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:var(--bg);border:1.5px solid var(--line);color:var(--navy);font-weight:700;font-size:1rem;padding:9px 14px;border-radius:999px}
.chips button:hover{border-color:var(--teal)}
.qrbox{background:#fff;border-radius:14px;padding:14px;display:flex;justify-content:center;border:1px solid var(--line)}
canvas{width:min(100%,300px);height:auto;image-rendering:pixelated;display:block}
.meter{display:flex;align-items:center;gap:12px;font-size:.95rem;color:var(--muted)}
.bar{flex:1;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--teal);transition:width .15s}
.meter.over{color:var(--bad)} .meter.over .bar span{background:var(--bad)}
.tips{font-size:.95rem;color:var(--muted);margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
footer{display:flex;justify-content:center}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.bar span{transition:none}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>로보독 방탈출</h1>
    <span class="team" id="teamTag"></span>
  </header>
  <button class="back" id="homeBtn" hidden>← 처음 화면</button>
  <ol class="rail" id="rail" hidden>
    <li>첫 번째 마당</li><li>C 퍼즐</li><li>두 번째 마당</li><li>금고</li>
  </ol>
  <main id="view"></main>
  <footer><button class="ghost" id="resetBtn" hidden>미션 처음부터 다시</button></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const H = { // sha256("robodog|" + 정답) — 정답 원문은 페이지에 없습니다
  A1:"586b8b30138abcf3e21dc9b22a63638fc3fc086c55e8b5db98e281ea41227d92",
  B1:"7588b5845cc4bc806a36fcf29a060b532ecf3989ffd2f178257033d4197df4b3",
  A2:"5b03369f4ba681d06c032474f95827d5c5adca8b28492bfeb8e966037742bb9c",
  B2:"f2f7a59034412dbac5fd4692e6560a08cd041d4d52fc43a2cccebcbbd8959315",
  PIN:"83d292bf86ef9de4d17e2a75f6d0cad96dbc69fca1f1be11be49e1c4d49af85f"
};
const KEY="robodog-escape-v2";
let S={screen:"home",m:"group",group:null};
try{const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.screen) S=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const norm=v=>v.toUpperCase().replace(/[^A-Z0-9]/g,"");
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("robodog|"+t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
const $=s=>document.querySelector(s);
const view=$("#view");
const ORDER=["yard1","puzzle","yard2","final"];
const bytesOf=t=>new TextEncoder().encode(t).length;

function show(screen){S.screen=screen;save();render();window.scrollTo(0,0);}
function step(m){S.m=m;S.screen="mission";save();render();window.scrollTo(0,0);}

function chrome(){
  const inMission=S.screen==="mission"; const i=inMission?ORDER.indexOf(S.m):-1;
  const r=$("#rail"); r.hidden=i<0;
  [...r.children].forEach((li,k)=>{li.className=k<i?"done":k===i?"now":"";});
  $("#teamTag").textContent=inMission&&S.group?`${S.group}조`:"";
  $("#homeBtn").hidden=S.screen==="home";
  $("#resetBtn").hidden=!(inMission&&S.m!=="group");
}

function answerForm(id,onOk,badMsg){
  return {html:`<div class="row"><input id="${id}" class="up" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="영어 단어" aria-label="정답"><button id="${id}Btn">확인</button></div><p class="msg" id="${id}Msg" role="status"></p>`,
  bind(){const inp=$("#"+id),btn=$("#"+id+"Btn"),msg=$("#"+id+"Msg");
    const check=async()=>{const v=norm(inp.value); if(!v){msg.className="msg bad";msg.textContent="정답을 입력하세요.";return;}
      if(await onOk(v)) return; msg.className="msg bad";msg.textContent=badMsg;
      inp.classList.remove("shake");void inp.offsetWidth;inp.classList.add("shake");inp.select();};
    btn.onclick=check; inp.onkeydown=e=>{if(e.key==="Enter")check();};}};
}

function qrPanel(opts){ // 입력 → 바이트 막대 → QR
  return `<label for="${opts.id}">${opts.label}</label>
    <input id="${opts.id}" class="${opts.upper?"up":""}" autocomplete="off" spellcheck="false" placeholder="${opts.ph}">
    <div class="meter" id="meter"><span id="bytes">0 / 8 바이트</span><div class="bar"><span id="barFill" style="width:0"></span></div></div>
    <p class="msg bad" id="overMsg" role="status"></p>
    <div class="qrbox"><canvas id="qr" width="290" height="290" aria-label="QR 코드"></canvas></div>`;
}
function bindQR(id,upper,storeKey){
  const inp=$("#"+id);
  const upd=()=>{let raw=inp.value.trim(); if(upper) raw=raw.toUpperCase();
    const n=bytesOf(raw);
    $("#bytes").textContent=`${n} / 8 바이트`;$("#barFill").style.width=Math.min(100,n/8*100)+"%";
    $("#meter").classList.toggle("over",n>8);
    $("#overMsg").textContent=n>8?"너무 길어요! 로보독은 영어 8자, 한글 2자까지만 읽어요.":"";
    drawQR(raw&&n<=8?raw:"",n>8);
    try{localStorage.setItem(storeKey,inp.value);}catch(e){}};
  try{inp.value=localStorage.getItem(storeKey)||"";}catch(e){}
  inp.oninput=upd; upd();
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{});}catch(e){}
  return {set(v){inp.value=v;upd();}};
}

    const qp=bindQR("mk",false,KEY+"-maker");

  else if(S.m==="group"){

      <span class="eyebrow">조 선택</span>
      <h2>우리 조는 어느 마당에서 출발하나요?</h2>
      <div class="pick"><button data-g="A" aria-pressed="false">A조</button><button data-g="B" aria-pressed="false">B조</button></div>
      <p class="sub">선생님이 알려준 조를 고르세요. 잘못 고르면 정답이 맞아도 통과할 수 없어요.</p>
      <p class="sub">한 명은 조이패드로 로봇을 조종하고, 한 명은 단서를 모아 암호를 풉니다. 카드는 로봇 카메라로만 읽어야 해요. 폰으로 찍으면 실격!</p>
      <button class="big" id="next" disabled>시작</button></div>`;
    let pick=null;

  }
  else if(S.m==="yard1"){
    const f=answerForm("a1",async v=>{if(await sha(v)===H[g+"1"]){step("puzzle");return true;}return false;},

    view.innerHTML=`<div class="card">
      <span class="eyebrow">${g}마당 · 첫 번째 미션</span>

      <p class="sub">카드에 적힌 번호는 글자의 순서예요. 열쇠 카드가 힌트를 줄 거예요.</p>

    bindQR("ans",true,KEY+"-ans");
  }
}
function drawQR(text,over){
  const cv=$("#qr"),ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);
  if(!text||typeof qrcode==="undefined"){ctx.fillStyle="#9DB0B8";ctx.font='500 15px "Gmarket Sans",sans-serif';ctx.textAlign="center";
    ctx.fillText(over?"8바이트 이하로 줄여 주세요":typeof qrcode==="undefined"?"인터넷 연결을 확인하세요":"글자를 입력하면 QR이 나타나요",cv.width/2,cv.height/2);return;}
  qrcode.stringToBytes=qrcode.stringToBytesFuncs["UTF-8"];
  const q=qrcode(0,"M");q.addData(text,"Byte");q.make();
  const n=q.getModuleCount(),quiet=4,cell=Math.floor(cv.width/(n+quiet*2)),off=Math.floor((cv.width-cell*n)/2);
  ctx.fillStyle="#000";
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(off+c*cell,off+r*cell,cell,cell);
}

};
